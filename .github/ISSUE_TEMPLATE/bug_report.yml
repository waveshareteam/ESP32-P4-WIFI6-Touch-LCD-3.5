name: Bug report / 错误报告
description: Report a reproducible source, documentation, CI, or hardware-integration problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove credentials, order numbers, private paths, and customer data before submitting.
        感谢反馈。提交前请移除凭据、订单号、私有路径和客户数据。
  - type: input
    id: board
    attributes:
      label: Board and hardware revision / 开发板与硬件版本
      placeholder: ESP32-P4-WIFI6-Touch-LCD-3.5, revision if known
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Example path / 示例路径
      placeholder: examples/esp-idf/09_video_lcd_display
    validations:
      required: true
  - type: input
    id: idf
    attributes:
      label: ESP-IDF and component versions / ESP-IDF 与组件版本
      placeholder: ESP-IDF v5.5.5; list any overrides
    validations:
      required: true
  - type: dropdown
    id: firmware_source
    attributes:
      label: Firmware source / 固件来源
      options:
        - Local source build / 本地源码构建
        - GitHub Actions artifact / GitHub Actions 制品
        - Checked-in factory image / 仓库出厂镜像
        - Other or unknown / 其他或未知
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include configuration changes, connected peripherals, and exact commands without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence / 实际行为与证据
      description: Add the smallest relevant build log, serial log, screenshot, or Actions URL.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check / 公开数据检查
      options:
        - label: I removed passwords, tokens, private paths, order/customer data, and other sensitive content. / 我已移除密码、令牌、私有路径、订单/客户数据及其他敏感内容。
          required: true
