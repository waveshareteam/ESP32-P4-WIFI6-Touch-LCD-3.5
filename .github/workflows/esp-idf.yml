name: ESP-IDF Examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      example:
        description: "all, an example directory name, or a repository-relative path"
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: esp-idf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.example || 'changes' }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify ESP-IDF impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.routing.outputs.mode }}
      examples: ${{ steps.routing.outputs.examples }}
      count: ${{ steps.routing.outputs.count }}
      docs-only: ${{ steps.routing.outputs.docs_only }}
      firmware-touched: ${{ steps.routing.outputs.firmware_touched }}
      release-review-required: ${{ steps.routing.outputs.release_review_required }}
      unknown-count: ${{ steps.routing.outputs.unknown_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route changed files
        id: routing
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EXAMPLE_SELECTOR: ${{ inputs.example || 'all' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/ci/classify_changes.py \
              --selector "$EXAMPLE_SELECTOR" \
              --github-output "$GITHUB_OUTPUT" \
              --report ci-routing-report.json
          else
            python3 scripts/ci/classify_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --report ci-routing-report.json
          fi
      - name: Run CI routing acceptance tests
        run: python3 -m unittest discover -s scripts/ci/tests -p "test_*.py" -v
      - name: Summarize routing
        run: |
          echo "### ESP-IDF routing" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat ci-routing-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.example.name }} / ESP-IDF ${{ matrix.idf }}
    if: ${{ needs.classify.outputs.count != '0' }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        idf:
          - v5.5.5
          - v6.0.2
        example: ${{ fromJSON(needs.classify.outputs.examples) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore component and compiler caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci-cache/component-manager/${{ matrix.idf }}/${{ matrix.example.name }}
            .ci-cache/ccache/${{ matrix.idf }}/${{ matrix.example.name }}
          key: >-
            esp-idf-${{ runner.os }}-${{ matrix.idf }}-esp32p4-${{ matrix.example.name }}-${{ hashFiles(format('{0}/**/idf_component.yml', matrix.example.path), '!examples/esp-idf/11_esp_brookesia_phone/components/brookesia_core/test_apps/**') }}
      - name: Build for ESP32-P4
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32p4
          path: ${{ matrix.example.path }}
          extra_docker_args: >-
            -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.ci-cache/component-manager/${{ matrix.idf }}/${{ matrix.example.name }}
            -e IDF_CCACHE_ENABLE=1
            -e CCACHE_DIR=/app/${{ github.repository }}/.ci-cache/ccache/${{ matrix.idf }}/${{ matrix.example.name }}
            -e CCACHE_MAXSIZE=200M
            -e CCACHE_COMPRESS=1
          command: idf.py --version && idf.py set-target esp32p4 && idf.py build
      - name: Package flashable firmware
        run: >-
          python3 scripts/ci/package_esp_idf.py
          --project "${{ matrix.example.path }}"
          --idf-version "${{ matrix.idf }}"
          --target esp32p4
      - name: Upload flashable firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp-idf-${{ matrix.idf }}-${{ matrix.example.name }}-esp32p4-${{ github.sha }}
          path: ci-artifacts/${{ matrix.idf }}-${{ matrix.example.name }}
          if-no-files-found: error
          retention-days: 14

  result:
    name: ESP-IDF build matrix
    if: always()
    needs:
      - classify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify routed matrix result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SELECTED_COUNT: ${{ needs.classify.outputs.count }}
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Change classification or its acceptance tests failed."
            exit 1
          fi
          if [[ "$SELECTED_COUNT" == "0" ]]; then
            if [[ "$BUILD_RESULT" != "skipped" ]]; then
              echo "No examples were selected, but the build result was $BUILD_RESULT."
              exit 1
            fi
            echo "No example build was required for this complete change set."
            exit 0
          fi
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "One or more selected ESP-IDF matrix jobs failed."
            exit 1
          fi
          echo "All selected ESP-IDF examples built successfully."
