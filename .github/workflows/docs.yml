name: Documentation

on:
  pull_request:
    paths:
      - "README*.md"
      - "LICENSE"
      - "assets/**"
      - "docs/**"
      - "example/ESP-IDF/*/CMakeLists.txt"
      - "firmware/**"
      - "schematic/**"
      - "scripts/check_readme.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "README*.md"
      - "LICENSE"
      - "assets/**"
      - "docs/**"
      - "example/ESP-IDF/*/CMakeLists.txt"
      - "firmware/**"
      - "schematic/**"
      - "scripts/check_readme.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 scripts/check_readme.py
