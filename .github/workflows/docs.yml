name: Documentation

on:
  pull_request:
    paths:
      - "README*.md"
      - "LICENSE"
      - "assets/**"
      - "example/ESP-IDF/**"
      - "firmware/**"
      - "schematic/**"
      - "scripts/check_readme.py"
      - ".github/workflows/docs.yml"
  push:
    paths:
      - "README*.md"
      - "LICENSE"
      - "assets/**"
      - "example/ESP-IDF/**"
      - "firmware/**"
      - "schematic/**"
      - "scripts/check_readme.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate README files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check documentation
        run: python3 scripts/check_readme.py
