dependencies:
  esp_codec_dev:
    version: "~1.5"
    public: true
  espressif/esp_lcd_st7796: '^1'
  espressif/esp_lcd_touch_ft5x06: ^1
  espressif/usb:
    version: "^1.4.0"
    rules:
      - if: "idf_version >=6.0"
